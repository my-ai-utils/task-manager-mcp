[package]
name = "task-manager"
version = "0.2.0"
edition = "2024"

# The whole product in one crate and one container: this binary serves the API, the MCP surface, the
# WebSocket AND the browser's bundle out of `./wwwroot`. Two crates sit beside it and are not members of
# anything — there is no workspace:
#
#   shared/   the wire contract, a path dependency of both sides
#   ui/       the Dioxus client; built by `./build-ui.sh` into `wwwroot/`, which is committed
#
# The layout is my-no-sql-server's, deliberately: one repository, one service, a release is a version
# number for a tag.

[dependencies]
# `postgres` brings my-postgres in and makes SdkSettingsTraits emit the PostgresSettings impl.
# `websockets` puts a WebSocket surface on the same HTTP server, which is how Home learns that a
# project changed. `http-static-files` is what serves the browser its bundle from this same server —
# see `http_server/ui_middleware.rs`. No `grpc` and no `my-service-bus`: there is nothing to talk to —
# this service is the whole product, and the MCP mutation and the WS fan-out happen in one process.
service-sdk = { tag = "0.5.0", git = "https://github.com/MyJetTools/service-sdk.git", features = [
    "macros",
    "postgres",
    "websockets",
    "http-static-files",
] }

# The wire contract, shared verbatim with the client in `ui/`. `server` makes MyHttpInput additionally
# emit the synchronous `parse` used by #[http_route(input_data: ...)].
task-manager-shared = { path = "./shared", features = ["server"] }

# MCP server, mounted on the service-sdk HTTP server at /mcp alongside the REST controllers.
# `my-ai-agent` is a direct dependency because the `ApplyJsonSchema` derive expands to paths
# rooted at `my_ai_agent::`.
mcp-server-middleware = { tag = "0.9.0", git = "https://github.com/my-ai-utils/mcp-server-middleware.git" }
my-ai-agent = { tag = "0.1.0", git = "https://github.com/my-ai-utils/my-ai-agent.git", features = [
    "agent",
] }

# `SortableId` for project ids. Direct dependency rather than through service-sdk because
# task-manager-shared names the same crate and the two must not resolve to different versions.
# `base64` for the binary half of a document. Only on this side: base64 exists because JSON cannot carry
# bytes, so it is the wire format for a binary payload and never the storage format — Postgres gets the real
# bytes in `bytea`. The browser needs no decoder either: it puts the same string straight into a `data:` URL.
# `hex` is the second feature and costs nothing — it pulls no crate, it is a module gated behind an empty
# feature — and it is how a sha256 digest becomes the 64-character string that keys a document's brief.
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "base64",
    "hex",
] }

# The Google OAuth code->token exchange and the userinfo read. FlUrl is the only HTTP client
# allowed in MyJetTools projects — reqwest is not.
flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url.git" }

# Searching documents and the board. `regex` rather than a hand-rolled scan for one reason that is about
# safety rather than convenience: the pattern comes from a tool argument, and this engine is guaranteed
# linear in the length of the input — a backtracking one would let `(a+)+b` hang the whole service. A plain
# substring query goes through the same code path with `regex::escape` around it, which costs nothing:
# the engine compiles a literal down to a memchr scan.
regex = "*"

# The unified diff between two versions of a document. Myers with hunk grouping and a unified-diff
# formatter already written — an algorithm worth using rather than owning, since the failure mode of a
# subtly wrong diff is a reader believing a change that did not happen.
similar = "*"

# The whole product state is held in memory and read on every request while being written at
# human/agent rate — the textbook ArcSwap case. `parking_lot` serialises writers (a plain
# Mutex<()>, never held across an await); `ahash` is the default for internal keys.
arc-swap = "*"
parking_lot = "*"
ahash = "*"

# A session is a protobuf model encrypted with a key from settings, carried entirely inside the token —
# so it survives a restart, needs no table and no in-memory map, and does not pin the service to one
# instance. Same shape as `mt-rest-api`'s refresh token.
encryption = { tag = "0.1.1", git = "https://github.com/MyJetTools/encryption.git" }
prost = "*"

# The content hash a document's brief is keyed by: same bytes, same key, whether they came out of Postgres
# or off a connected repository's clone. sha256 rather than anything cheaper because this string is a
# durable database key — `ahash` above is seeded per process and would change every restart. It is already
# in the graph (postgres-protocol uses it for SCRAM), so declaring it adds no crate and no second version.
# NOTE: sha2 0.11's digest is a `hybrid_array::Array` with no `LowerHex` — `format!("{:x}")` does not
# compile. `rust_extensions::hex` is the encoder.
sha2 = "*"

# The nonce inside a login `state`, so two sign-ins started in the same second differ.
uuid = { version = "*", features = ["v4"] }

# Unpacking an uploaded zip into one document per file. `deflate` and nothing else: those are the two
# methods a zip made by Finder, Explorer or `zip` uses (stored and deflated), and the default feature set
# drags in bzip2, lzma, zstd and aes for archives nobody uploads here.
zip = { version = "*", default-features = false, features = ["deflate"] }

tokio = { version = "*", features = ["full"] }
async-trait = "*"
serde = { version = "*", features = ["derive"] }
serde_derive = "*"
serde_json = "*"
serde_yaml = "*"
# The whole board lives in memory and every write replaces a snapshot wholesale, so the process
# allocates and frees the same shapes over and over while never holding much at once. jemalloc hands
# that memory back instead of letting the arena settle at the high-water mark, which is what the
# default allocator would do.
tikv-jemallocator = { version = "*", features = [
    "unprefixed_malloc_on_supported_platforms",
] }
