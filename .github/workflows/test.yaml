name: Test it

# The server's tests and the wire crate's, on every push to main — my-no-sql-server's test workflow.
# The client's tests are not here: they are a native build of a Dioxus app, which is a second
# dependency graph the size of this one, for a crate CI never builds otherwise.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions-rust-lang/setup-rust-toolchain@v1.15.2
        with:
          toolchain: stable
          rustflags: ""

      # service-sdk pulls in `my-telemetry-writer`, whose build script runs prost-build.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Test the server
        run: |
          export GIT_HUB_TOKEN="${{ secrets.PUBLISH_TOKEN }}"
          cargo test

      - name: Test the wire crate
        run: cargo test --manifest-path shared/Cargo.toml
