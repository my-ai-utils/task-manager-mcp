[application]
name = "task-manager-ui"
default_platform = "web"
asset_dir = "assets"

[web.app]
title = "Task Manager"

[web.watcher]
reload_html = false
index_on_404 = true

[web.resource]
style = ["/assets/app.css"]
# The mermaid bootstrap — a kilobyte that watches for `<pre class="mermaid">` and fetches the 3.5Mb library
# only when one appears. Loading it here rather than the library itself is the whole point: most sessions
# never open a diagram.
script = ["/assets/mermaid-boot.js"]

[web.resource.dev]
script = []
