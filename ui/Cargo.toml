[package]
name = "task-manager-ui"
version = "0.1.30"
edition = "2024"

[features]
default = ["web"]
web = ["dioxus/web"]

[dependencies]
dioxus = { version = "0.7.9", features = ["router"] }
dioxus-utils = { tag = "0.7.0", git = "https://github.com/MyJetTools/dioxus-utils.git", features = [
    "web",
] }

# The wire contract, reused verbatim from the server. No `server` feature here — the client only needs
# the schema plus the FlUrl request builder.
task-manager-shared = { path = "../shared" }
# FlUrl compiles to the browser fetch API under wasm and resolves relative "/api/..." URLs against the
# page origin, so no base URL is ever computed.
flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url.git" }
# Names the `THttpRequestBuilder` bound the authed-request helpers are written against.
my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git" }
# `KindColor` — the palette a kind's colour is drawn from, and `AsStr` to read it.
# `base64` for the one thing this client uploads: a file's bytes, which JSON cannot carry. Encoding happens at
# that boundary and nowhere else — a document read back is bytes from the raw endpoint, never base64.
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "base64",
] }

# The WebSocket Home holds open. A browser cannot put headers on it — the session rides as a cookie, which it
# does send on the handshake.
reqwasm = "*"
futures = { version = "*" }

# A task's text is Markdown. Safe by default: `markdown::to_html` escapes raw HTML rather than passing
# it through, which matters because the text is written by agents.
markdown = { version = "1" }

serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }

# Decoding the OAuth callback's query arguments. Nothing upstream does it: dioxus-web builds the route
# from `location.search()` verbatim, and the router's generated parse is a plain `split('&')` +
# `split_once('=')` onto `String::from_str`. So an authorization code arrives as `4%2F0A…` and our base64
# state as `…%2F%2BsXa…`. Hand-rolling the decode would mean a UTF-8-correct percent decoder for two
# values that merely happen to be ASCII — a trap for whoever touches it next.
percent-encoding = "*"

web-sys = { version = "*", features = [
    "Storage",
    "Window",
    "console",
    # Leaving the origin for Google's consent screen — a cross-origin navigation, so not a router push.
    "Location",
    # Replacing the URL after the OAuth callback, so a reload does not re-submit a spent code.
    "History",
    # Expiring the cookie an older build remembered the open board in — that preference is local storage now.
    # `HtmlDocument` rather than `Document` because `cookie()` lives on the html-specific interface.
    "Document",
    "HtmlDocument",
    # Copying a link to a task off its card. `Navigator` only to reach `navigator.clipboard`, which is where
    # `writeText` lives.
    "Navigator",
    "Clipboard",
] }
js-sys = { version = "*" }
# `JsValue::from_str` for the console helper, and the state argument of `History::replace_state_with_url`.
wasm-bindgen = { version = "*" }

[build-dependencies]
ci-utils = { git = "https://github.com/MyJetTools/ci-utils.git", tag = "0.1.3" }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
