# Stack for the `task-manager-mcp` product on HETZNER.
#
# Run by hand:
#
#   docker compose -f docker-compose.yaml up -d --remove-orphans
#
# `--remove-orphans` matters once, on the first deploy of this shape: the product used to be two
# containers, `task-manager-rest-api` and `task-manager-ui`, and the first of them holds host port 31500
# — the one this container publishes. Compose leaves a service that has left the file running unless it
# is told otherwise, and then this one cannot bind.
#
# Volume paths use `${HOME}` rather than `~`. release-mcp expands `~` itself via HOST_HOME, but
# `docker compose` does not — it hands the path to the daemon verbatim, and the daemon has no idea what
# `~` means. `${HOME}` is substituted by Compose and works either way.
#
# ONE container is the whole product. The server answers `/api`, `/mcp`, `/ws` and `/raw`, and serves the
# browser its bundle — baked into the image as `./wwwroot` — for everything else. So there is one port to
# publish and one upstream for the reverse proxy; the client calls back on relative `/api/...` URLs to
# the origin it was loaded from, which is this same container.
#
# The container port is not arbitrary: service-sdk's HTTP server listens on 8000 (8888 is its second,
# technical port). The host port comes from the 31500+ range reserved for this product; 31501, which the
# client's own container used to publish, is free again.
services:
  task-manager-mcp:
    image: ghcr.io/my-ai-utils/task-manager:0.2.0
    hostname: task-manager-mcp
    container_name: task-manager-mcp
    restart: always
    environment:
    # TCP, not the unix socket, because the settings-service holding this product is on ANOTHER machine.
    # HETZNER has a settings-service of its own — an older 0.3.0 — and it does not know this product:
    # pointing at its socket returns `404 - Not Found`, which the service cannot parse as its
    # SettingsModel, so it panics and restart-loops. That is not a misconfigured template, it is the
    # wrong settings-service.
    #
    # The host comes from `${SETTINGS_IP}` rather than a literal, so the address lives in one place —
    # release-mcp resolves it from its own process environment, and `docker compose` run by hand takes it
    # from the shell.
    #
    # The template is still called `task-manager-rest-api`, the name this service had while the client
    # was a container of its own. It is a record in settings-service, and it was left alone on purpose:
    # renaming a crate is not a reason to make a deploy wait on a rename in another system.
    - SETTINGS_URL=http://${SETTINGS_IP}:9898/settings/task-manager-mcp/task-manager-rest-api
    - ENV_INFO=HOME
    - UNIX_SOCKET=1
    ports:
    - 31500:8000
    volumes:
    - ${HOME}/unix-sockets/task-manager-mcp/http:/root/http
    - ${HOME}/unix-sockets/task-manager-mcp/grpc:/root/grpc
    - ${HOME}/unix-sockets/task-manager-mcp/system:/root/product-system-sockets
    - ${HOME}/unix-sockets/system:/root/system-sockets
    # Where connected repositories are CLONED.
    #
    # It has to be a mount rather than the container's writable layer, and the reason is cost rather
    # than loss: a connection is read-only and Refresh deletes its folder and clones it again, so
    # nothing in here exists only in here. On the writable layer, though, every deploy would re-download
    # every connected repository before a board that was already loaded could be read. This is the path
    # `git_repos_path` defaults to; a settings template that overrides it has to move both.
    - ${HOME}/task-manager-mcp/git-repos:/root/git-repos
    deploy:
      resources:
        limits:
          # Above the 64Mb default on purpose: this service holds every project, task, comment and user
          # in memory, and each write replaces a snapshot wholesale. 64Mb would be a restart loop as
          # soon as a board grew.
          #
          # Connected GitHub repositories do NOT move this number, even though they are now full
          # clones: the clone is on the DISK below, and what this process holds for one is still a
          # list of paths and sizes. The largest thing a read ever allocates is the one file being
          # read, bounded by MAX_BINARY_LEN like every other document, and git does its own work in
          # its own process.
          #
          # Serving the client does not move it either. The bundle is read off the image's disk per
          # request and is not held: the largest file in it is the wasm, a few megabytes, for as long
          # as one response takes.
          memory: 256Mb
    logging:
      options:
        max-size: "512Kb"
        max-file: "1"
    networks:
    - docker_net

networks:
  docker_net:
    external: true
